<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pb Sports Tv — Live Match Center</title>
  <!-- একটিমাত্র প্লেয়ার: Shaka Player (MPD + M3U8 দুটোই সাপোর্ট করে) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.6/shaka-player.compiled.min.js"></script>
  <style>
    :root {
      --bg: #060a13;
      --card-border: #14532d;
      --live-glow: rgba(16, 185, 129, 0.25);
      --accent: #f97316;
      --live-red: #ef4444;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 85px;
    }

    .topbar {
      background: #0c1220;
      border-bottom: 1px solid #1e293b;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand {
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #f8fafc;
      font-size: 16px;
    }
    .brand span { color: var(--accent); }

    .container {
      max-width: 1100px;
      margin: 14px auto;
      padding: 0 12px;
    }

    /* ======================================================
       CRICFLIX STYLE SINGLE SHAKA PLAYER
       ====================================================== */
    .cf-player-wrap {
      display: none;
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 520px;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #1e293b;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.7);
      margin-bottom: 16px;
      user-select: none;
    }
    .cf-player-wrap.active { display: block; }

    .cf-player-wrap video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    /* Top Gradient Overlay */
    .cf-top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      transition: opacity 0.25s;
    }
    .cf-match-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .cf-live-pill {
      background: var(--live-red);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .cf-live-dot {
      width: 6px; height: 6px;
      background: #fff;
      border-radius: 50%;
      animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0.3; } }

    .cf-title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cf-close-btn {
      background: rgba(15, 23, 42, 0.85);
      color: #f1f5f9;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .cf-close-btn:hover { background: var(--live-red); border-color: var(--live-red); }

    /* Center Buffering Spinner */
    .cf-spinner {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
      z-index: 8;
      pointer-events: none;
    }
    .cf-spinner.show { display: flex; }
    .spinner-ring {
      width: 44px; height: 44px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error Toast inside Player */
    .cf-error {
      position: absolute;
      top: 52px; left: 16px; right: 16px;
      background: rgba(127, 29, 29, 0.92);
      color: #fecaca;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 12;
      display: none;
    }

    /* Bottom Control Bar */
    .cf-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 10px 14px 12px;
      background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 10;
      transition: opacity 0.25s;
    }
    .cf-player-wrap.idle .cf-top-bar,
    .cf-player-wrap.idle .cf-controls {
      opacity: 0;
      pointer-events: none;
    }
    .cf-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cf-btn {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .cf-btn:hover { background: var(--accent); border-color: var(--accent); }

    .cf-vol {
      width: 70px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .cf-select {
      background: rgba(15, 23, 42, 0.95);
      color: #f8fafc;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    .cf-watermark {
      font-size: 11px;
      font-weight: 800;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.8px;
    }

    /* ======================================================
       TABS & MATCH CARDS
       ====================================================== */
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .tab-btn {
      background: #161f33;
      color: #cbd5e1;
      border: 1px solid #28354f;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .match-card {
      background: linear-gradient(90deg, #091a16 0%, #0b1320 50%, #091a16 100%);
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      padding: 14px 18px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .match-card:hover {
      transform: translateY(-2px);
      border-color: #10b981;
      box-shadow: 0 6px 20px var(--live-glow);
    }
    .hot-badge {
      position: absolute;
      top: -9px;
      left: 14px;
      background: #052e16;
      border: 1px solid #16a34a;
      color: #4ade80;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 6px;
    }
    .card-top {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #e2e8f0;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .card-body {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }
    .team {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
    }
    .team.right {
      justify-content: flex-end;
      text-align: right;
    }
    .team img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: contain;
      background: #0f172a;
      padding: 3px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .center-status {
      text-align: center;
      min-width: 110px;
    }
    .live-indicator {
      color: var(--live-red);
      font-weight: 800;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .pulse-dot {
      width: 10px;
      height: 10px;
      background: var(--live-red);
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .upcoming-text {
      color: #cbd5e1;
      font-weight: 700;
      font-size: 13px;
    }
    .sub-time {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      border: 1px solid #334155;
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      gap: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      z-index: 60;
    }
    .nav-item {
      background: none;
      border: none;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 20px;
    }
    .nav-item.active {
      background: #fff;
      color: #0f172a;
    }

    @media (max-width: 600px) {
      .team { font-size: 13px; gap: 6px; }
      .team img { width: 28px; height: 28px; }
      .center-status { min-width: 85px; }
      .cf-vol { width: 50px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand">Pb Sports <span>Tv</span></div>
    <div style="font-size: 12px; color: #94a3b8;" id="clock"></div>
  </div>

  <div class="container">
    <!-- CricFlix Style Single Shaka Player -->
    <div class="cf-player-wrap" id="cfPlayerWrap">
      <div class="cf-top-bar">
        <div class="cf-match-meta">
          <span class="cf-live-pill"><span class="cf-live-dot"></span>LIVE</span>
          <span class="cf-title" id="cfTitle">Select a match</span>
        </div>
        <button class="cf-close-btn" onclick="closePlayer()">✕ Close</button>
      </div>

      <div class="cf-spinner" id="cfSpinner">
        <div class="spinner-ring"></div>
      </div>

      <div class="cf-error" id="cfError"></div>

      <video id="videoPlayer" playsinline></video>

      <div class="cf-controls">
        <div class="cf-group">
          <button class="cf-btn" id="playPauseBtn" onclick="togglePlay()">⏸ Pause</button>
          <button class="cf-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
          <input type="range" class="cf-vol" id="volSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
          <span class="cf-watermark">Pb Sports Tv</span>
        </div>

        <div class="cf-group">
          <select class="cf-select" id="qualitySelect" onchange="changeQuality(this.value)">
            <option value="auto">Auto Quality</option>
          </select>
          <button class="cf-btn" onclick="togglePiP()" title="Picture in Picture">⧉ PiP</button>
          <button class="cf-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶ Full</button>
        </div>
      </div>
    </div>

    <div class="tabs" id="filterTabs"></div>
    <div class="match-list" id="matchList"></div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="setFilter('all', this)">🏠 Live</button>
    <button class="nav-item" onclick="setFilter('live', this)">📺 Binedon</button>
    <button class="nav-item" onclick="setFilter('upcoming', this)">📡 IPTV</button>
  </div>

  <script>
    // শুধু url এবং দরকার হলে clearKeys দিন (.mpd বা .m3u8 দুটোই এই একটাই Shaka Player চালাবে)
    const MATCHES = [
      {
        id: "willow-1",
        hot: true,
        sport: "CRICKET",
        matchTitle: "LIVE CRICKET — WILLOW SPORTS",
        channelName: "Willow Sports",
        teamA: { name: "Willow", logo: "https://i.postimg.cc/HntSg3xw/20240823_024624.png" },
        teamB: { name: "Sports HD", logo: "https://i.postimg.cc/HntSg3xw/20240823_024624.png" },
        start: "2026-11-17T18:00:00+06:00",
        end:   "2026-11-18T02:00:00+06:00",
        url: "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/tll6uwepxa/out/v1/a7f67cbb33df46539312956427343886/cenc.mpd",
        clearKeys: {
          "290e09c837da78d5cd961978d390515c": "b748836c71e6a4ca68ef5b5652db6247"
        }
      },
      {
        id: "laliga-1",
        hot: true,
        sport: "FOOTBALL",
        matchTitle: "LA LIGA HD LIVE",
        channelName: "Laliga HD",
        teamA: { name: "Laliga", logo: "https://i.postimg.cc/v8JPQjFK/laliga.png" },
        teamB: { name: "HD Live", logo: "https://i.postimg.cc/v8JPQjFK/laliga.png" },
        start: "2026-11-17T20:00:00+06:00",
        end:   "2026-11-18T04:00:00+06:00",
        url: "https://abfjk4haaaaaaaampv6ofhkihi4r6.bia-cf.live.pv-cdn.net/iad-nitro/live/clients/dash/enc/m6sqanvm2m/out/v1/f6beb46c6e9a4132ad739f3ca27df6aa/cenc.mpd",
        clearKeys: {
          "1444f4235529f183f0a5a486befe9cdb": "e5e3fec67a1bb3472a2089c8a0a2557f"
        }
      },
      {
        id: "fancode-1",
        hot: true,
        sport: "SPORTS",
        matchTitle: "FANCODE 1 LIVE STREAM",
        channelName: "FANCODE 1",
        teamA: { name: "FanCode", logo: "https://i.postimg.cc/ZRV7W8cV/fancode.png" },
        teamB: { name: "Stream 1", logo: "https://i.postimg.cc/ZRV7W8cV/fancode.png" },
        start: "2026-11-17T21:00:00+06:00",
        end:   "2026-11-18T05:00:00+06:00",
        url: "https://example.com/live/sample.m3u8"
      }
    ];

    let currentFilter = "all";
    let shakaPlayer = null;
    let idleTimer = null;

    const wrap = document.getElementById("cfPlayerWrap");
    const video = document.getElementById("videoPlayer");
    const spinner = document.getElementById("cfSpinner");
    const errBox = document.getElementById("cfError");

    function showSpinner(show) {
      spinner.classList.toggle("show", show);
    }

    function showError(msg) {
      errBox.style.display = msg ? "block" : "none";
      errBox.textContent = msg || "";
    }

    function wakeControls() {
      wrap.classList.remove("idle");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (!video.paused) wrap.classList.add("idle");
      }, 3000);
    }
    wrap.addEventListener("mousemove", wakeControls);
    wrap.addEventListener("touchstart", wakeControls);
    video.addEventListener("click", togglePlay);
    video.addEventListener("waiting", () => showSpinner(true));
    video.addEventListener("playing", () => {
      showSpinner(false);
      document.getElementById("playPauseBtn").textContent = "⏸ Pause";
      wakeControls();
    });
    video.addEventListener("pause", () => {
      document.getElementById("playPauseBtn").textContent = "▶ Play";
      wrap.classList.remove("idle");
    });

    function togglePlay() {
      if (video.paused) video.play().catch(() => {});
      else video.pause();
    }

    function toggleMute() {
      video.muted = !video.muted;
      document.getElementById("muteBtn").textContent = video.muted ? "🔇" : "🔊";
    }

    function changeVolume(val) {
      video.volume = parseFloat(val);
      video.muted = video.volume === 0;
      document.getElementById("muteBtn").textContent = video.muted ? "🔇" : "🔊";
    }

    async function togglePiP() {
      try {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else if (document.pictureInPictureEnabled) await video.requestPictureInPicture();
      } catch (_) {}
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        wrap.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.().catch(() => {});
      }
    }

    function populateQualities() {
      const select = document.getElementById("qualitySelect");
      select.innerHTML = `<option value="auto">Auto Quality</option>`;
      if (!shakaPlayer) return;
      const tracks = shakaPlayer.getVariantTracks();
      const heights = [...new Set(tracks.map(t => t.height).filter(Boolean))].sort((a, b) => b - a);
      heights.forEach(h => {
        const opt = document.createElement("option");
        opt.value = h;
        opt.textContent = `${h}p`;
        select.appendChild(opt);
      });
    }

    function changeQuality(val) {
      if (!shakaPlayer) return;
      if (val === "auto") {
        shakaPlayer.configure({ abr: { enabled: true } });
        return;
      }
      shakaPlayer.configure({ abr: { enabled: false } });
      const tracks = shakaPlayer.getVariantTracks();
      const matchTrack = tracks.find(t => String(t.height) === String(val));
      if (matchTrack) shakaPlayer.selectVariantTrack(matchTrack, true);
    }

    function getMatchStatus(match, now = new Date()) {
      const start = new Date(match.start);
      const end = new Date(match.end);
      if (now >= start && now <= end) return "live";
      if (now < start) return "upcoming";
      return "recent";
    }

    function render() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const enriched = MATCHES.map(m => ({ ...m, status: getMatchStatus(m, now) }));
      const counts = {
        all: enriched.length,
        live: enriched.filter(m => m.status === "live").length,
        recent: enriched.filter(m => m.status === "recent").length,
        upcoming: enriched.filter(m => m.status === "upcoming").length,
      };

      document.getElementById("filterTabs").innerHTML = `
        <button class="tab-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All (${counts.all})</button>
        <button class="tab-btn ${currentFilter === 'live' ? 'active' : ''}" onclick="setFilter('live')">Live (${counts.live})</button>
        <button class="tab-btn ${currentFilter === 'recent' ? 'active' : ''}" onclick="setFilter('recent')">Recent (${counts.recent})</button>
        <button class="tab-btn ${currentFilter === 'upcoming' ? 'active' : ''}" onclick="setFilter('upcoming')">Upcoming (${counts.upcoming})</button>
      `;

      const filtered = currentFilter === "all" ? enriched : enriched.filter(m => m.status === currentFilter);

      document.getElementById("matchList").innerHTML = filtered.map(m => {
        const startStr = new Date(m.start).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const centerHtml = m.status === "live"
          ? `<div class="live-indicator"><div class="pulse-dot"></div>Live</div>`
          : m.status === "upcoming"
          ? `<div class="upcoming-text">Upcoming</div><div class="sub-time">Starts ${startStr}</div>`
          : `<div class="upcoming-text" style="color:#64748b;">Ended</div>`;

        return `
          <div class="match-card" onclick="playMatch('${m.id}')">
            ${m.hot ? `<div class="hot-badge">HOT 🔥</div>` : ""}
            <div class="card-top">🏏 ${m.sport} | ${m.matchTitle}</div>
            <div class="card-body">
              <div class="team">
                <img src="${m.teamA.logo}" alt="${m.teamA.name}">
                <span>${m.teamA.name}</span>
              </div>
              <div class="center-status">${centerHtml}</div>
              <div class="team right">
                <span>${m.teamB.name}</span>
                <img src="${m.teamB.logo}" alt="${m.teamB.name}">
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function setFilter(filter, navBtn = null) {
      currentFilter = filter;
      if (navBtn) {
        document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
        navBtn.classList.add("active");
      }
      render();
    }

    async function playMatch(id) {
      const match = MATCHES.find(m => m.id === id);
      if (!match) return;

      showError("");
      showSpinner(true);
      document.getElementById("cfTitle").textContent = `${match.channelName} — ${match.matchTitle}`;
      wrap.classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });

      try {
        if (shakaPlayer) {
          await shakaPlayer.destroy();
          shakaPlayer = null;
        }
        shaka.polyfill.installAll();
        shakaPlayer = new shaka.Player(video);

        shakaPlayer.configure({
          drm: {
            clearKeys: match.clearKeys || {}
          },
          streaming: {
            bufferingGoal: 15,
            rebufferingGoal: 2
          }
        });

        await shakaPlayer.load(match.url);
        populateQualities();
        video.muted = false;
        await video.play().catch(async () => {
          video.muted = true;
          document.getElementById("muteBtn").textContent = "🔇";
          await video.play();
        });
        showSpinner(false);
        wakeControls();
      } catch (e) {
        showSpinner(false);
        showError("Stream load error: " + (e.message || e));
      }
    }

    async function closePlayer() {
      video.pause();
      if (shakaPlayer) {
        await shakaPlayer.destroy();
        shakaPlayer = null;
      }
      wrap.classList.remove("active");
    }

    render();
    setInterval(render, 15000);
  </script>
</body>
</html>
