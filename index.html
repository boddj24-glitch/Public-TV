<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHAWON TV — Live Match Center</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #070b14;
      --card-bg: #0b161f;
      --card-border: #134e3a;
      --live-glow: rgba(16, 185, 129, 0.25);
      --accent: #f97316;
      --live-red: #ef4444;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 80px;
    }

    /* Top Header */
    .topbar {
      background: #0d1322;
      border-bottom: 1px solid #1e293b;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand {
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #f8fafc;
      font-size: 16px;
    }
    .brand span { color: var(--accent); }

    .container {
      max-width: 1100px;
      margin: 14px auto;
      padding: 0 12px;
    }

    /* Player Modal / Box */
    .player-wrapper {
      display: none;
      background: #000;
      border: 1px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .player-wrapper.active { display: block; }
    .player-header {
      background: #0f172a;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .close-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }
    video {
      width: 100%;
      max-height: 460px;
      display: block;
      background: #000;
    }

    /* Filter Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .tab-btn {
      background: #161f33;
      color: #cbd5e1;
      border: 1px solid #28354f;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Match Cards */
    .match-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .match-card {
      background: linear-gradient(90deg, #091a16 0%, #0b1320 50%, #091a16 100%);
      border: 1.5px solid #155e45;
      border-radius: 10px;
      padding: 14px 18px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .match-card:hover {
      transform: translateY(-2px);
      border-color: #10b981;
      box-shadow: 0 6px 20px var(--live-glow);
    }
    .hot-badge {
      position: absolute;
      top: -9px;
      left: 14px;
      background: #052e16;
      border: 1px solid #16a34a;
      color: #4ade80;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 6px;
    }
    .card-top {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #e2e8f0;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .card-body {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }
    .team {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
    }
    .team.right {
      justify-content: flex-end;
      text-align: right;
    }
    .team img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .center-status {
      text-align: center;
      min-width: 110px;
    }
    .live-indicator {
      color: var(--live-red);
      font-weight: 800;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .pulse-dot {
      width: 10px;
      height: 10px;
      background: var(--live-red);
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .upcoming-text {
      color: #cbd5e1;
      font-weight: 700;
      font-size: 13px;
    }
    .sub-time {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      border: 1px solid #334155;
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      gap: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      z-index: 60;
    }
    .nav-item {
      background: none;
      border: none;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 20px;
    }
    .nav-item.active {
      background: #fff;
      color: #0f172a;
    }

    @media (max-width: 600px) {
      .team { font-size: 13px; gap: 6px; }
      .team img { width: 26px; height: 26px; }
      .center-status { min-width: 85px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand">SHAWON<span>TV</span> LIVE</div>
    <div style="font-size: 12px; color: #94a3b8;" id="clock"></div>
  </div>

  <div class="container">
    <!-- Live Player -->
    <div class="player-wrapper" id="playerWrapper">
      <div class="player-header">
        <span id="playingTitle">Playing Match...</span>
        <button class="close-btn" onclick="closePlayer()">✕ Close</button>
      </div>
      <video id="videoPlayer" controls autoplay muted playsinline></video>
    </div>

    <!-- Filter Tabs -->
    <div class="tabs" id="filterTabs"></div>

    <!-- Match Cards Container -->
    <div class="match-list" id="matchList"></div>
  </div>

  <!-- Bottom Floating Bar -->
  <div class="bottom-nav">
    <button class="nav-item active" onclick="setFilter('all', this)">🏠 Live</button>
    <button class="nav-item" onclick="setFilter('live', this)">📺 Binedon</button>
    <button class="nav-item" onclick="setFilter('upcoming', this)">📡 IPTV</button>
  </div>

  <script>
    // ========================================================
    // শুধু এই MATCHES অ্যারেতে আপনার লিংক, টিম লোগো ও সময় দিন
    // ========================================================
    const MATCHES = [
      {
        id: "m1",
        hot: true,
        sport: "CRICKET",
        league: "PAKISTAN VS SRI LANKA, 2ND TEST",
        teamA: { name: "Pakistan", logo: "https://flagcdn.com/w80/pk.png" },
        teamB: { name: "Sri Lanka", logo: "https://flagcdn.com/w80/lk.png" },
        start: "2026-11-17T10:00:00+06:00",
        end:   "2026-11-17T23:59:00+06:00",
        streamUrl: "YOUR_STREAM_LINK_1.m3u8"
      },
      {
        id: "m2",
        hot: true,
        sport: "CRICKET",
        league: "BANGLADESH VS SOUTH AFRICA",
        teamA: { name: "Bangladesh", logo: "https://flagcdn.com/w80/bd.png" },
        teamB: { name: "South Africa", logo: "https://flagcdn.com/w80/za.png" },
        start: "2026-11-17T14:00:00+06:00",
        end:   "2026-11-17T23:59:00+06:00",
        streamUrl: "YOUR_STREAM_LINK_2.m3u8"
      },
      {
        id: "m3",
        hot: true,
        sport: "FOOTBALL",
        league: "SAFF CHAMPIONSHIP 2026",
        teamA: { name: "SAFF", logo: "https://via.placeholder.com/40?text=A" },
        teamB: { name: "SAFF", logo: "https://via.placeholder.com/40?text=B" },
        start: "2026-11-17T22:00:00+06:00",
        end:   "2026-11-18T01:00:00+06:00",
        streamUrl: "YOUR_STREAM_LINK_3.m3u8"
      }
    ];

    let currentFilter = "all";
    let hlsInstance = null;

    function getMatchStatus(match, now = new Date()) {
      const start = new Date(match.start);
      const end = new Date(match.end);
      if (now >= start && now <= end) return "live";
      if (now < start) return "upcoming";
      return "recent";
    }

    function render() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const enriched = MATCHES.map(m => ({ ...m, status: getMatchStatus(m, now) }));
      const counts = {
        all: enriched.length,
        live: enriched.filter(m => m.status === "live").length,
        recent: enriched.filter(m => m.status === "recent").length,
        upcoming: enriched.filter(m => m.status === "upcoming").length,
      };

      // Tabs render
      const tabsEl = document.getElementById("filterTabs");
      tabsEl.innerHTML = `
        <button class="tab-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All (${counts.all})</button>
        <button class="tab-btn ${currentFilter === 'live' ? 'active' : ''}" onclick="setFilter('live')">Live (${counts.live})</button>
        <button class="tab-btn ${currentFilter === 'recent' ? 'active' : ''}" onclick="setFilter('recent')">Recent (${counts.recent})</button>
        <button class="tab-btn ${currentFilter === 'upcoming' ? 'active' : ''}" onclick="setFilter('upcoming')">Upcoming (${counts.upcoming})</button>
      `;

      // Cards render
      const listEl = document.getElementById("matchList");
      const filtered = currentFilter === "all" ? enriched : enriched.filter(m => m.status === currentFilter);

      listEl.innerHTML = filtered.map(m => {
        const startStr = new Date(m.start).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const centerHtml = m.status === "live"
          ? `<div class="live-indicator"><div class="pulse-dot"></div>Live</div>`
          : m.status === "upcoming"
          ? `<div class="upcoming-text">Upcoming</div><div class="sub-time">Starts ${startStr}</div>`
          : `<div class="upcoming-text" style="color:#64748b;">Ended</div>`;

        return `
          <div class="match-card" onclick="playMatch('${m.id}')">
            ${m.hot ? `<div class="hot-badge">HOT 🔥</div>` : ""}
            <div class="card-top">🏏 ${m.sport} | ${m.league}</div>
            <div class="card-body">
              <div class="team">
                <img src="${m.teamA.logo}" alt="${m.teamA.name}">
                <span>${m.teamA.name}</span>
              </div>
              <div class="center-status">${centerHtml}</div>
              <div class="team right">
                <span>${m.teamB.name}</span>
                <img src="${m.teamB.logo}" alt="${m.teamB.name}">
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function setFilter(filter, navBtn = null) {
      currentFilter = filter;
      if (navBtn) {
        document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
        navBtn.classList.add("active");
      }
      render();
    }

    function playMatch(id) {
      const match = MATCHES.find(m => m.id === id);
      if (!match) return;

      const wrapper = document.getElementById("playerWrapper");
      const video = document.getElementById("videoPlayer");
      document.getElementById("playingTitle").textContent = `${match.teamA.name} vs ${match.teamB.name} — ${match.league}`;
      wrapper.classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });

      if (Hls.isSupported() && match.streamUrl.includes(".m3u8")) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls();
        hlsInstance.loadSource(match.streamUrl);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else {
        video.src = match.streamUrl;
        video.play().catch(() => {});
      }
    }

    function closePlayer() {
      const video = document.getElementById("videoPlayer");
      video.pause();
      if (hlsInstance) hlsInstance.destroy();
      document.getElementById("playerWrapper").classList.remove("active");
    }

    render();
    setInterval(render, 15000); // প্রতি ১৫ সেকেন্ডে অটো স্ট্যাটাস চেক
  </script>
</body>
</html>
