<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shaka Player - MPD / M3U8 (DRM & Non-DRM)</title>
  <!-- Shaka Player compiled library -->
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>
</head>
<body>

  <!-- সাধারণ HTML video ট্যাগ (কন্ট্রোলসহ) -->
  <video id="video" width="640" autoplay controls></video>

  <script>
    // আগের কোড থেকে আসা স্ট্রিম এবং DRM ইনফরমেশন
    const STREAMS = [
      {
        name: "Willow Sports",
        url: "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/tll6uwepxa/out/v1/a7f67cbb33df46539312956427343886/cenc.mpd",
        useDrm: true,
        clearKeys: {
          "290e09c837da78d5cd961978d390515c": "b748836c71e6a4ca68ef5b5652db6247"
        }
      },
      {
        name: "Laliga HD",
        url: "https://abfjk4haaaaaaaampv6ofhkihi4r6.bia-cf.live.pv-cdn.net/iad-nitro/live/clients/dash/enc/m6sqanvm2m/out/v1/f6beb46c6e9a4132ad739f3ca27df6aa/cenc.mpd",
        useDrm: true,
        clearKeys: {
          "1444f4235529f183f0a5a486befe9cdb": "e5e3fec67a1bb3472a2089c8a0a2557f"
        }
      },
      {
        name: "FANCODE 1",
        url: "https://example.com/live/sample.m3u8",
        useDrm: false,
        clearKeys: {}
      }
    ];

    // কোন স্ট্রিম চালু হবে তা এখান থেকে ঠিক করুন (0 = Willow Sports, 1 = Laliga HD, 2 = FANCODE 1)
    const activeIndex = 0;
    const streamConfig = STREAMS[activeIndex];

    async function initApp() {
      // ব্রাউজার কম্প্যাটিবিলিটির জন্য পলিবিল ইনস্টল করা
      shaka.polyfill.installAll();

      if (shaka.Player.isBrowserSupported()) {
        const video = document.getElementById('video');
        const player = new shaka.Player(video);

        // এরর হ্যান্ডলিং
        player.addEventListener('error', (event) => {
          console.error('Error code', event.detail.code, 'object', event.detail);
        });

        // যদি ClearKey DRM থাকে, তবে কনফিগারেশন যোগ করা
        if (streamConfig.useDrm && Object.keys(streamConfig.clearKeys).length > 0) {
          player.configure({
            drm: {
              clearKeys: streamConfig.clearKeys
            }
          });
        }

        try {
          // স্ট্রিম লোড করা (লিংকটি .mpd হোক বা .m3u8, Shaka প্লেয়ার অটো ডিটেক্ট করবে)
          await player.load(streamConfig.url);
          console.log('Stream loaded successfully:', streamConfig.name);
        } catch (e) {
          console.error('Error loading stream', e);
        }
      } else {
        console.error('Browser not supported!');
      }
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>

</body>
</html>
