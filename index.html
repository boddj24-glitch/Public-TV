<script>
    // URL Parameter থেকে 'url' লিঙ্কটি খুঁজে নেওয়ার কোড
    const urlParams = new URLSearchParams(window.location.search);
    let targetUrl = urlParams.get('url');

    // যদি লিঙ্কের শেষে কোনো ?url= না দেওয়া থাকে, তবে এটি ডিফল্ট লিঙ্ক হিসেবে কাজ করবে
    if (!targetUrl) {
        targetUrl = "http://manreef.com/live/D9F2D8735CFC0D4/QjCmvV5W3T/72142.ts.m3u8";
    }

    // ফ্রি পাব্লিক CORS প্রক্সি যুক্ত করা
    const proxiedUrl = "https://corsproxy.io/?" + encodeURIComponent(targetUrl);

    const video = document.getElementById('my-video');

    if (Hls.isSupported()) {
        const hls = new HLS();
        hls.loadSource(proxiedUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
            video.play();
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = proxiedUrl;
        video.addEventListener('loadedmetadata', function () {
            video.play();
        });
    }
</script>
