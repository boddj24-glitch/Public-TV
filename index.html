<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pb Sports Tv — OTT Live</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.6/shaka-player.compiled.min.js"></script>
  <style>
    :root {
      --bg: #050811;
      --panel: #0d1424;
      --panel-2: #131c31;
      --border: rgba(148, 163, 184, 0.14);
      --accent: #ff5a1f;
      --accent-soft: rgba(255, 90, 31, 0.18);
      --live: #ff2e4c;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
      background: radial-gradient(circle at top, #111b33 0%, var(--bg) 52%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* OTT Top Navbar */
    .ott-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(14px);
      background: rgba(5, 8, 17, 0.82);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ott-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.4px;
    }
    .ott-logo-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ff5a1f, #ff8a00);
      display: grid;
      place-items: center;
      font-size: 13px;
      color: #fff;
      box-shadow: 0 4px 14px rgba(255, 90, 31, 0.4);
    }
    .ott-logo span { color: var(--accent); }
    .ott-clock {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 999px;
    }

    .wrap {
      max-width: 1120px;
      margin: 16px auto;
      padding: 0 14px;
    }

    /* =====================================================
       OTT CINEMA PLAYER STAGE
       ===================================================== */
    .ott-stage {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }
    .ott-stage.active { display: block; }

    .stage-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: linear-gradient(90deg, rgba(255,90,31,0.12) 0%, rgba(13,20,36,0.95) 45%);
      border-bottom: 1px solid var(--border);
    }
    .stage-channel {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .stage-channel img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: contain;
      background: #080d18;
      padding: 4px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .stage-text { min-width: 0; }
    .stage-sub {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
    }
    .stage-title {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 46, 76, 0.16);
      border: 1px solid rgba(255, 46, 76, 0.45);
      color: #ff6b81;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .live-chip .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--live);
      animation: pulse 1.1s infinite;
    }

    .player-error {
      padding: 9px 16px;
      background: rgba(239, 68, 68, 0.16);
      border-bottom: 1px solid rgba(239, 68, 68, 0.35);
      color: #fecaca;
      font-size: 12px;
      display: none;
    }

    .stage-video-wrap {
      position: relative;
      background: #000;
    }
    .stage-video-wrap video {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 540px;
      display: block;
      background: #000;
    }

    .stage-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 16px;
      background: #090e1a;
      border-top: 1px solid var(--border);
    }
    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ctrl-pill {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s;
    }
    .ctrl-pill:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .ctrl-select {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }

    /* =====================================================
       OTT FILTER PILLS & MATCH SHELF
       ===================================================== */
    .shelf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .shelf-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    .filter-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pill-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s;
    }
    .pill-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px var(--accent-soft);
    }

    .ott-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }
    .ott-card {
      background: linear-gradient(160deg, var(--panel-2) 0%, var(--panel) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }
    .ott-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 90, 31, 0.55);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .sport-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 9px;
      border-radius: 6px;
    }
    .status-pill {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .status-pill.live {
      background: rgba(255, 46, 76, 0.18);
      color: #ff6b81;
    }
    .status-pill.live .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--live);
      animation: pulse 1.1s infinite;
    }
    .status-pill.upcoming {
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
    }
    .status-pill.recent {
      background: rgba(148, 163, 184, 0.14);
      color: #94a3b8;
    }

    .card-match-title {
      font-size: 14px;
      font-weight: 800;
      color: #f8fafc;
      margin-top: 6px;
    }

    .vs-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5, 8, 17, 0.55);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .vs-team {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 700;
    }
    .vs-team.end { flex-direction: row-reverse; text-align: right; }
    .vs-team img {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      object-fit: contain;
      background: #0b1220;
      padding: 3px;
    }
    .vs-badge {
      font-size: 11px;
      font-weight: 900;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 8px;
      border-radius: 6px;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 46, 76, 0.7); }
      70% { box-shadow: 0 0 0 7px rgba(255, 46, 76, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 46, 76, 0); }
    }

    /* Bottom Floating Dock */
    .bottom-dock {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 20, 36, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      display: flex;
      gap: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65);
      z-index: 60;
    }
    .dock-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
    }
    .dock-btn.active {
      background: #fff;
      color: #050811;
    }
  </style>
</head>
<body>

  <header class="ott-nav">
    <div class="ott-logo">
      <div class="ott-logo-mark">PB</div>
      <div>Pb Sports <span>Tv</span></div>
    </div>
    <div class="ott-clock" id="clock"></div>
  </header>

  <main class="wrap">
    <!-- OTT Cinema Player Stage -->
    <section class="ott-stage" id="ottStage">
      <div class="stage-meta-bar">
        <div class="stage-channel">
          <img id="stageLogo" src="" alt="" />
          <div class="stage-text">
            <div class="stage-sub" id="stageChannel">LIVE STREAM</div>
            <div class="stage-title" id="stageTitle">Match Title</div>
          </div>
        </div>
        <div class="live-chip"><span class="dot"></span>LIVE</div>
      </div>

      <div class="player-error" id="playerError"></div>

      <div class="stage-video-wrap">
        <video id="videoPlayer" controls autoplay muted playsinline></video>
      </div>

      <div class="stage-controls">
        <div class="ctrl-group">
          <button class="ctrl-pill" id="playBtn" onclick="togglePlay()">⏸ Pause</button>
          <button class="ctrl-pill" id="muteBtn" onclick="toggleMute()">🔇 Unmute</button>
        </div>
        <div class="ctrl-group">
          <select class="ctrl-select" id="qualitySelect" onchange="changeQuality(this.value)">
            <option value="auto">Auto Quality</option>
          </select>
          <button class="ctrl-pill" onclick="togglePiP()">⧉ PiP</button>
          <button class="ctrl-pill" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        </div>
      </div>
    </section>

    <!-- Match Shelf -->
    <div class="shelf-header">
      <div class="shelf-title">Live &amp; Upcoming Broadcasts</div>
      <div class="filter-pills" id="filterPills"></div>
    </div>

    <div class="ott-grid" id="matchGrid"></div>
  </main>

  <nav class="bottom-dock">
    <button class="dock-btn active" onclick="setFilter('all', this)">🏠 Home</button>
    <button class="dock-btn" onclick="setFilter('live', this)">📺 Binedon</button>
    <button class="dock-btn" onclick="setFilter('upcoming', this)">📡 IPTV</button>
  </nav>

  <script>
    const MATCHES = [
      {
        id: "willow-1",
        hot: true,
        sport: "CRICKET",
        matchTitle: "LIVE CRICKET — WILLOW SPORTS",
        channelName: "Willow Sports",
        logo: "https://i.postimg.cc/HntSg3xw/20240823_024624.png",
        teamA: { name: "Willow", logo: "https://i.postimg.cc/HntSg3xw/20240823_024624.png" },
        teamB: { name: "Sports HD", logo: "https://i.postimg.cc/HntSg3xw/20240823_024624.png" },
        start: "2026-11-17T18:00:00+06:00",
        end:   "2026-11-18T02:00:00+06:00",
        url: "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/tll6uwepxa/out/v1/a7f67cbb33df46539312956427343886/cenc.mpd",
        clearKeys: {
          "290e09c837da78d5cd961978d390515c": "b748836c71e6a4ca68ef5b5652db6247"
        }
      },
      {
        id: "laliga-1",
        hot: true,
        sport: "FOOTBALL",
        matchTitle: "LA LIGA HD LIVE",
        channelName: "Laliga HD",
        logo: "https://i.postimg.cc/v8JPQjFK/laliga.png",
        teamA: { name: "Laliga", logo: "https://i.postimg.cc/v8JPQjFK/laliga.png" },
        teamB: { name: "HD Live", logo: "https://i.postimg.cc/v8JPQjFK/laliga.png" },
        start: "2026-11-17T20:00:00+06:00",
        end:   "2026-11-18T04:00:00+06:00",
        url: "https://abfjk4haaaaaaaampv6ofhkihi4r6.bia-cf.live.pv-cdn.net/iad-nitro/live/clients/dash/enc/m6sqanvm2m/out/v1/f6beb46c6e9a4132ad739f3ca27df6aa/cenc.mpd",
        clearKeys: {
          "1444f4235529f183f0a5a486befe9cdb": "e5e3fec67a1bb3472a2089c8a0a2557f"
        }
      },
      {
        id: "fancode-1",
        hot: true,
        sport: "SPORTS",
        matchTitle: "FANCODE 1 LIVE STREAM",
        channelName: "FANCODE 1",
        logo: "https://i.postimg.cc/ZRV7W8cV/fancode.png",
        teamA: { name: "FanCode", logo: "https://i.postimg.cc/ZRV7W8cV/fancode.png" },
        teamB: { name: "Stream 1", logo: "https://i.postimg.cc/ZRV7W8cV/fancode.png" },
        start: "2026-11-17T21:00:00+06:00",
        end:   "2026-11-18T05:00:00+06:00",
        url: "https://example.com/live/sample.m3u8"
      }
    ];

    let currentFilter = "all";
    let shakaPlayer = null;

    function populateQualities() {
      const select = document.getElementById("qualitySelect");
      select.innerHTML = `<option value="auto">Auto Quality</option>`;
      if (!shakaPlayer) return;
      const heights = [...new Set(shakaPlayer.getVariantTracks().map(t => t.height).filter(Boolean))].sort((a, b) => b - a);
      heights.forEach(h => {
        const opt = document.createElement("option");
        opt.value = h;
        opt.textContent = `${h}p`;
        select.appendChild(opt);
      });
    }

    function changeQuality(val) {
      if (!shakaPlayer) return;
      if (val === "auto") {
        shakaPlayer.configure({ abr: { enabled: true } });
        return;
      }
      shakaPlayer.configure({ abr: { enabled: false } });
      const track = shakaPlayer.getVariantTracks().find(t => String(t.height) === String(val));
      if (track) shakaPlayer.selectVariantTrack(track, true);
    }

    function togglePlay() {
      const video = document.getElementById("videoPlayer");
      if (video.paused) video.play().catch(() => {});
      else video.pause();
    }

    function toggleMute() {
      const video = document.getElementById("videoPlayer");
      video.muted = !video.muted;
    }

    async function togglePiP() {
      const video = document.getElementById("videoPlayer");
      try {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else if (document.pictureInPictureEnabled) await video.requestPictureInPicture();
      } catch (_) {}
    }

    function toggleFullscreen() {
      const stage = document.getElementById("ottStage");
      if (!document.fullscreenElement) stage.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.().catch(() => {});
    }

    function getMatchStatus(match, now = new Date()) {
      const start = new Date(match.start);
      const end = new Date(match.end);
      if (now >= start && now <= end) return "live";
      if (now < start) return "upcoming";
      return "recent";
    }

    function render() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const enriched = MATCHES.map(m => ({ ...m, status: getMatchStatus(m, now) }));
      const counts = {
        all: enriched.length,
        live: enriched.filter(m => m.status === "live").length,
        recent: enriched.filter(m => m.status === "recent").length,
        upcoming: enriched.filter(m => m.status === "upcoming").length,
      };

      document.getElementById("filterPills").innerHTML = `
        <button class="pill-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All (${counts.all})</button>
        <button class="pill-btn ${currentFilter === 'live' ? 'active' : ''}" onclick="setFilter('live')">Live (${counts.live})</button>
        <button class="pill-btn ${currentFilter === 'recent' ? 'active' : ''}" onclick="setFilter('recent')">Recent (${counts.recent})</button>
        <button class="pill-btn ${currentFilter === 'upcoming' ? 'active' : ''}" onclick="setFilter('upcoming')">Upcoming (${counts.upcoming})</button>
      `;

      const filtered = currentFilter === "all" ? enriched : enriched.filter(m => m.status === currentFilter);

      document.getElementById("matchGrid").innerHTML = filtered.map(m => {
        const startStr = new Date(m.start).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const badgeHtml = m.status === "live"
          ? `<span class="status-pill live"><span class="dot"></span>LIVE</span>`
          : m.status === "upcoming"
          ? `<span class="status-pill upcoming">${startStr}</span>`
          : `<span class="status-pill recent">Ended</span>`;

        return `
          <article class="ott-card" onclick="playMatch('${m.id}')">
            <div>
              <div class="card-head">
                <span class="sport-tag">${m.sport}</span>
                ${badgeHtml}
              </div>
              <div class="card-match-title">${m.matchTitle}</div>
            </div>
            <div class="vs-row">
              <div class="vs-team">
                <img src="${m.teamA.logo}" alt="${m.teamA.name}">
                <span>${m.teamA.name}</span>
              </div>
              <span class="vs-badge">VS</span>
              <div class="vs-team end">
                <img src="${m.teamB.logo}" alt="${m.teamB.name}">
                <span>${m.teamB.name}</span>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function setFilter(filter, dockBtn = null) {
      currentFilter = filter;
      if (dockBtn) {
        document.querySelectorAll(".dock-btn").forEach(b => b.classList.remove("active"));
        dockBtn.classList.add("active");
      }
      render();
    }

    async function playMatch(id) {
      const match = MATCHES.find(m => m.id === id);
      if (!match) return;

      const stage = document.getElementById("ottStage");
      const video = document.getElementById("videoPlayer");
      const errBox = document.getElementById("playerError");

      document.getElementById("stageLogo").src = match.logo;
      document.getElementById("stageChannel").textContent = match.channelName;
      document.getElementById("stageTitle").textContent = match.matchTitle;
      errBox.style.display = "none";

      stage.classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });

      try {
        if (shakaPlayer) {
          await shakaPlayer.destroy();
          shakaPlayer = null;
        }
        shaka.polyfill.installAll();
        shakaPlayer = new shaka.Player(video);

        shakaPlayer.configure({
          drm: {
            clearKeys: match.clearKeys || {}
          }
        });

        await shakaPlayer.load(match.url);
        populateQualities();
        video.play().catch(() => {});
      } catch (e) {
        errBox.style.display = "block";
        errBox.textContent = "Stream error: " + (e.message || e);
      }
    }

    document.getElementById("videoPlayer").addEventListener("play", () => {
      document.getElementById("playBtn").textContent = "⏸ Pause";
    });
    document.getElementById("videoPlayer").addEventListener("pause", () => {
      document.getElementById("playBtn").textContent = "▶ Play";
    });
    document.getElementById("videoPlayer").addEventListener("volumechange", (e) => {
      document.getElementById("muteBtn").textContent = e.target.muted ? "🔇 Unmute" : "🔊 Mute";
    });

    render();
    setInterval(render, 15000);
  </script>
</body>
</html>
