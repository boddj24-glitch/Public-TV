<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PB SPORTS TV — Shaka Player (MPD / M3U8)</title>
  
  <!-- Social Media Preview Meta Tags -->
  <meta property="og:title" id="ogTitle" content="PB SPORTS TV — Live Streaming" />
  <meta property="og:description" content="Watch live HD streaming of Cricket, Football & League matches." />
  <meta property="og:image" id="ogImage" content="https://i.postimg.cc/HntSg3xw/20240823_024624.png" />
  <meta property="og:type" content="website" />

  <!-- Shaka Player compiled library -->
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>
  <!-- HLS.js for M3U8 support -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #070b14; color: #f1f5f9; padding: 14px; }
    .wrap { max-width: 1180px; margin: 0 auto; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: #0c1220; border: 1px solid #1e293b;
      border-radius: 8px; margin-bottom: 10px;
    }
    .brand { font-weight: 900; color: #f97316; letter-spacing: 0.5px; font-size: 16px; }

    .notice-bar {
      background: #0c1220; border: 1px solid #1e293b; border-radius: 8px;
      padding: 8px 12px; margin-bottom: 10px; font-size: 13px; color: #cbd5e1;
      overflow: hidden; white-space: nowrap;
    }

    .channel-wait-notice {
      display: none;
      background: rgba(249, 115, 22, 0.16);
      border-bottom: 1px solid rgba(249, 115, 22, 0.35);
      color: #ffedd5;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .social-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;
    }
    .social-btn {
      text-align: center; text-decoration: none; font-weight: 700; font-size: 13px;
      padding: 9px 12px; border-radius: 6px; color: #fff;
    }
    .whatsapp-btn { background: #16a34a; }
    .telegram-btn { background: #0284c7; }

    .player-section {
      display: none; margin-bottom: 14px; background: #0c1220;
      border: 1px solid #1e293b; border-radius: 10px; overflow: hidden;
      position: relative;
    }
    .player-section.active { display: block; }
    .player-head {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 8px 12px; background: #111827; font-size: 13px; font-weight: 700;
    }
    .player-head-btns { display: flex; align-items: center; gap: 6px; }
    .pip-btn, .close-btn {
      background: #1e293b; color: #fff; border: 1px solid #334155;
      padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .pip-btn:hover, .close-btn:hover { border-color: #f97316; }

    .player-controls-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 8px 12px; background: #0f172a; border-top: 1px solid #1e293b;
      font-size: 12px; flex-wrap: wrap;
    }
    .time-badge {
      font-variant-numeric: tabular-nums;
      color: #e2e8f0;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .res-trigger {
      background: #1e293b; color: #f8fafc; border: 1px solid #334155;
      padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 12px;
    }
    .res-trigger:hover { border-color: #f97316; }

    /* Resolution Menu */
    .res-menu {
      display: none;
      position: absolute;
      right: 12px;
      bottom: 44px;
      width: 240px;
      background: rgba(24, 24, 27, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.75);
      z-index: 40;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .res-menu.open { display: block; }
    .res-menu-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 700; font-size: 13px; color: #f4f4f5;
    }
    .res-close { background: none; border: none; color: #a1a1aa; font-size: 16px; cursor: pointer; line-height: 1; }
    .res-list { max-height: 280px; overflow-y: auto; padding: 6px 0; }
    .res-item {
      width: 100%; background: none; border: none; color: #e4e4e7;
      padding: 9px 14px; text-align: left; font-size: 13px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
    }
    .res-item:hover, .res-item.active { background: rgba(255, 255, 255, 0.1); }
    .hd-tag { color: #ef4444; font-size: 10px; font-weight: 900; margin-left: 4px; vertical-align: super; }
    .check-mark { color: #f8fafc; font-weight: 800; }

    #video { width: 100%; max-height: 480px; background: #000; display: block; }

    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .tab-btn {
      background: #161f33; color: #cbd5e1; border: 1px solid #28354f;
      padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .tab-btn.active { background: #f97316; border-color: #f97316; color: #fff; }

    .match-list { display: flex; flex-direction: column; gap: 10px; }
    .match-card {
      position: relative; background: linear-gradient(90deg, #071c16 0%, #0b1320 50%, #071c16 100%);
      border: 1.5px solid #14532d; border-radius: 8px; padding: 14px 16px; cursor: pointer;
    }
    .match-card:hover { border-color: #22c55e; }
    .hot-badge {
      position: absolute; top: -9px; left: 12px; background: #052e16;
      border: 1px solid #16a34a; color: #4ade80; font-size: 10px; font-weight: 700;
      padding: 1px 6px; border-radius: 4px;
    }
    .card-top { text-align: center; font-size: 12px; font-weight: 700; margin-bottom: 10px; color: #e2e8f0; }
    .card-body {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
    }
    .team { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
    .team.right { justify-content: flex-end; }
    .team img { width: 32px; height: 32px; border-radius: 6px; object-fit: contain; background: #0f172a; padding: 2px; }
    .status-box { text-align: center; font-size: 12px; font-weight: 700; }
    .live-text { color: #ef4444; }
    .upcoming-text { color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">PB SPORTS TV</div>
      <div id="clock" style="font-size: 12px; color: #94a3b8;"></div>
    </div>

    <div class="notice-bar">
      Watch live HD streaming of Cricket, Football, T10 &amp; League matches.
    </div>

    <div class="social-row">
      <a href="https://wa.me/8801812895985" target="_blank" class="social-btn whatsapp-btn">💬 WhatsApp</a>
      <a href="https://t.me/+VqDOF_-beaQyMWY1" target="_blank" class="social-btn telegram-btn">📱 Telegram</a>
    </div>

    <div class="player-section" id="playerSection">
      <div class="player-head">
        <span id="playerTitle">Now Playing</span>
        <div class="player-head-btns">
          <button class="pip-btn" onclick="togglePiP()">Pop-up ⧉</button>
          <button class="close-btn" onclick="closePlayer()">Close</button>
        </div>
      </div>

      <div class="channel-wait-notice" id="channelWaitNotice">
        চ্যানেল লোড হচ্ছে ১ মিনিট অপেক্ষা করুন
      </div>

      <video id="video" width="640" autoplay controls playsinline></video>

      <div class="player-controls-bar">
        <div class="time-badge">
          <span id="liveTimeDisplay">17951:49:25</span>
          <span id="activeResLabel" style="color:#94a3b8;font-weight:600;">(Auto)</span>
        </div>
        <button class="res-trigger" type="button" onclick="toggleResolutionMenu()">Resolution ▾</button>
      </div>

      <div class="res-menu" id="resolutionMenu">
        <div class="res-menu-head">
          <span>Resolution</span>
          <button class="res-close" type="button" onclick="toggleResolutionMenu(false)">✕</button>
        </div>
        <div class="res-list" id="resolutionList"></div>
      </div>
    </div>

    <div class="tabs" id="filterTabs"></div>
    <div class="match-list" id="matchList"></div>
  </div>

  <script>
    const SPORT_JSON_URL = "./sport.json";
    const SPORT_M3U_URL = "./sport.m3u";

    let STREAMS = [];
    let activeIndex = 0;
    let currentTab = "all";
    let shakaInstance = null;
    let hlsInstance = null;
    let selectedResolution = "auto";

    function parsePipeDrm(rawUrl, clearKeys = {}) {
      if (!rawUrl || typeof rawUrl !== "string") {
        return { url: "", useDrm: false, clearKeys: {} };
      }
      const [cleanUrl, queryPart] = rawUrl.split("|");
      const parsedKeys = { ...clearKeys };
      if (queryPart) {
        const params = new URLSearchParams(queryPart.replace(/&drmLicense=/g, "&drmLicense="));
        const license = params.get("drmLicense");
        if (license && license.includes(":")) {
          const [kid, key] = license.split(":");
          if (kid && key) parsedKeys[kid.trim()] = key.trim();
        }
      }
      return {
        url: (cleanUrl || "").trim(),
        useDrm: Object.keys(parsedKeys).length > 0,
        clearKeys: parsedKeys
      };
    }

    // দেশের নাম ও পতাকা অটোমেটিক ডিটেক্ট করার ম্যাপিং ফাংশন
    function getTeamInfoFromName(fullName) {
      if (!fullName) return null;
      const nameLower = fullName.toLowerCase();
      const teamsMap = {
        "bangladesh": { name: "Bangladesh", logo: "https://flagcdn.com/w80/bd.png" },
        "south africa": { name: "South Africa", logo: "https://flagcdn.com/w80/za.png" },
        "india": { name: "India", logo: "https://flagcdn.com/w80/in.png" },
        "australia": { name: "Australia", logo: "https://flagcdn.com/w80/au.png" },
        "pakistan": { name: "Pakistan", logo: "https://flagcdn.com/w80/pk.png" },
        "england": { name: "England", logo: "https://flagcdn.com/w80/gb.png" },
        "sri lanka": { name: "Sri Lanka", logo: "https://flagcdn.com/w80/lk.png" },
        "new zealand": { name: "New Zealand", logo: "https://flagcdn.com/w80/nz.png" },
        "west indies": { name: "West Indies", logo: "https://i.postimg.cc/HntSg3xw/20240823_024624.png" },
        "afghanistan": { name: "Afghanistan", logo: "https://flagcdn.com/w80/af.png" }
      };

      for (const [key, val] of Object.entries(teamsMap)) {
        if (nameLower.includes(key)) {
          return val;
        }
      }
      return null;
    }

    // স্মার্ট অটো-ফিল এবং বাংলাদেশ সময় (BST / UTC+6) অনুযায়ী স্ট্যাটাস চেক ফাংশন
    function normalizeJsonItem(item, index = 0) {
      const drmInfo = parsePipeDrm(item.url || "", item.clearKeys || {});
      const defaultLogo = item.logoUrl || item.tvgLogo || item.logo || "https://i.postimg.cc/HntSg3xw/20240823_024624.png";
      const channelName = item.name || `Channel ${index + 1}`;
      const sportCategory = (item.sport || item.category || "SPORTS").toUpperCase();
      const matchTitle = item.matchTitle || item.name || channelName;

      let calculatedStatus = "live";

      // বাংলাদেশ সময় (BST / UTC+6) অনুযায়ী সময় হিসাব
      if (item.startTime) {
        let timeStr = item.startTime;
        if (!timeStr.includes("Z") && !timeStr.includes("+")) {
          timeStr += "+06:00";
        }
        const matchTime = new Date(timeStr).getTime();
        const currentTime = Date.now();
        if (currentTime < matchTime) {
          calculatedStatus = "upcoming";
        }
      } else if (item.status) {
        calculatedStatus = item.status.toLowerCase() === "upcoming" ? "upcoming" : "live";
      }

      // অটোমেটিক টিম ও লোগো ডিটেকশন
      let teamA = item.teamA;
      let teamB = item.teamB;

      if (!teamA || !teamB) {
        if (matchTitle.toLowerCase().includes(" vs ")) {
          const parts = matchTitle.split(/vs/i);
          const t1Name = parts[0].trim();
          const t2Name = parts[1] ? parts[1].trim() : "Live";

          const foundT1 = getTeamInfoFromName(t1Name);
          const foundT2 = getTeamInfoFromName(t2Name);

          teamA = foundT1 || { name: t1Name, logo: defaultLogo };
          teamB = foundT2 || { name: t2Name, logo: defaultLogo };
        } else {
          teamA = { name: channelName, logo: defaultLogo };
          teamB = { name: sportCategory, logo: defaultLogo };
        }
      }

      return {
        name: channelName,
        hot: item.hot ?? true,
        sport: sportCategory,
        matchTitle: matchTitle,
        status: calculatedStatus,
        teamA: teamA,
        teamB: teamB,
        url: drmInfo.url,
        useDrm: Boolean(item.useDrm || drmInfo.useDrm),
        clearKeys: Object.keys(item.clearKeys || {}).length > 0 ? item.clearKeys : drmInfo.clearKeys
      };
    }

    function parseM3uText(m3uText) {
      const lines = m3uText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const items = [];
      let currentMeta = null;

      for (const line of lines) {
        if (line.startsWith("#EXTINF:")) {
          const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
          const groupMatch = line.match(/group-title="([^"]*)"/i);
          const timeMatch = line.match(/starttime="([^"]*)"/i);
          const commaIdx = line.lastIndexOf(",");
          const title = commaIdx !== -1 ? line.slice(commaIdx + 1).trim() : "Live Channel";
          
          currentMeta = {
            name: title,
            sport: (groupMatch?.[1] || "SPORTS").toUpperCase(),
            logo: logoMatch?.[1] || "",
            startTime: timeMatch ? timeMatch[1] : null
          };
        } else if (line.startsWith("#EXT")) {
          continue;
        } else if (currentMeta) {
          const drmInfo = parsePipeDrm(line);
          if (drmInfo.url) {
            const defaultLogo = currentMeta.logo || "https://i.postimg.cc/HntSg3xw/20240823_024624.png";
            const dummyItem = {
              name: currentMeta.name,
              sport: currentMeta.sport,
              matchTitle: currentMeta.name,
              startTime: currentMeta.startTime,
              url: drmInfo.url,
              useDrm: drmInfo.useDrm,
              clearKeys: drmInfo.clearKeys,
              logoUrl: defaultLogo
            };
            items.push(normalizeJsonItem(dummyItem, items.length));
          }
          currentMeta = null;
        }
      }
      return items;
    }

    async function loadStreamsFromFiles() {
      const combined = [];
      try {
        const jsonRes = await fetch(SPORT_JSON_URL, { cache: "no-store" });
        if (jsonRes.ok) {
          const jsonData = await jsonRes.json();
          const arr = Array.isArray(jsonData) ? jsonData : (jsonData.streams || []);
          arr.forEach((item, idx) => {
            const normalized = normalizeJsonItem(item, idx);
            if (normalized.url) combined.push(normalized);
          });
        }
      } catch (e) {
        console.warn("sport.json load failed:", e);
      }

      try {
        const m3uRes = await fetch(SPORT_M3U_URL, { cache: "no-store" });
        if (m3uRes.ok) {
          const m3uText = await m3uRes.text();
          combined.push(...parseM3uText(m3uText));
        }
      } catch (e) {
        console.warn("sport.m3u load failed:", e);
      }

      STREAMS = combined;
      renderMatches();

      const urlParams = new URLSearchParams(window.location.search);
      const matchIdx = urlParams.get('match');
      if (matchIdx !== null && STREAMS[Number(matchIdx)]) {
        playStream(Number(matchIdx));
      }
    }

    function showWaitNotice(customText) {
      const notice = document.getElementById("channelWaitNotice");
      if (!notice) return;
      notice.textContent = typeof customText === "string" ? customText : "চ্যানেল লোড হচ্ছে ১ মিনিট অপেক্ষা করুন";
      notice.style.display = "block";
    }

    function hideWaitNotice() {
      const notice = document.getElementById("channelWaitNotice");
      if (notice) notice.style.display = "none";
    }

    const BASE_SECONDS = (17951 * 3600) + (49 * 60) + 25;
    const bootTimestamp = Date.now();

    function formatLargeDuration(totalSec) {
      const safe = Math.max(0, Math.floor(totalSec));
      const h = Math.floor(safe / 3600);
      const m = Math.floor((safe % 3600) / 60);
      const s = safe % 60;
      return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function updateLiveTimeCounter() {
      const elapsed = Math.floor((Date.now() - bootTimestamp) / 1000);
      const el = document.getElementById("liveTimeDisplay");
      if (el) el.textContent = formatLargeDuration(BASE_SECONDS + elapsed);
    }

    function formatBitrate(bandwidth) {
      if (!bandwidth) return "";
      const mbps = bandwidth / 1_000_000;
      if (mbps >= 1) {
        const rounded = Number.isInteger(mbps) ? mbps : parseFloat(mbps.toFixed(1));
        return ` (${rounded} Mbps)`;
      }
      return ` (${Math.round(bandwidth / 1000)} Kbps)`;
    }

    function renderResolutionMenu() {
      const listEl = document.getElementById("resolutionList");
      if (!listEl) return;

      const tracks = shakaInstance ? shakaInstance.getVariantTracks() : [];
      const uniqueMap = new Map();

      tracks.forEach((t) => {
        if (!t.height) return;
        const key = `${t.height}-${t.bandwidth || 0}`;
        if (!uniqueMap.has(key)) {
          uniqueMap.set(key, { id: t.id, height: t.height, bandwidth: t.bandwidth || 0 });
        }
      });

      const sortedTracks = [...uniqueMap.values()].sort((a, b) => {
        if (b.height !== a.height) return b.height - a.height;
        return b.bandwidth - a.bandwidth;
      });

      const fallbackPresets = [
        { id: "1080-8", height: 1080, bandwidth: 8_000_000, hd: true },
        { id: "720-5", height: 720, bandwidth: 5_000_000, hd: false },
        { id: "540-0", height: 540, bandwidth: 0, hd: false },
        { id: "396-1.3", height: 396, bandwidth: 1_300_000, hd: false },
        { id: "288-0", height: 288, bandwidth: 0, hd: false }
      ];

      const itemsToShow = sortedTracks.length > 0 ? sortedTracks : fallbackPresets;

      let html = itemsToShow.map((item) => {
        const isActive = String(selectedResolution) === String(item.id);
        const isHd = item.hd || item.height >= 720;
        const label = `${item.height}p${formatBitrate(item.bandwidth)}`;
        return `
          <button class="res-item ${isActive ? "active" : ""}" type="button" onclick="applyResolution('${item.id}', '${label}')">
            <span>${label}${isHd ? `<span class="hd-tag">HD</span>` : ""}</span>
            <span class="check-mark">${isActive ? "✓" : ""}</span>
          </button>
        `;
      }).join("");

      const autoActive = selectedResolution === "auto";
      html += `
        <button class="res-item ${autoActive ? "active" : ""}" type="button" onclick="applyResolution('auto', 'Auto')">
          <span>Auto</span>
          <span class="check-mark">${autoActive ? "✓" : ""}</span>
        </button>
      `;

      listEl.innerHTML = html;
    }

    function applyResolution(resId, labelText) {
      selectedResolution = resId;
      const labelEl = document.getElementById("activeResLabel");
      if (labelEl) labelEl.textContent = `(${labelText})`;

      if (shakaInstance) {
        if (resId === "auto") {
          shakaInstance.configure({ abr: { enabled: true } });
        } else {
          shakaInstance.configure({ abr: { enabled: false } });
          const tracks = shakaInstance.getVariantTracks();
          const exact = tracks.find(t => String(t.id) === String(resId));
          if (exact) {
            shakaInstance.selectVariantTrack(exact, true);
          } else {
            const targetHeight = Number(String(resId).split("-")[0]);
            const byHeight = tracks.find(t => t.height === targetHeight);
            if (byHeight) shakaInstance.selectVariantTrack(byHeight, true);
          }
        }
      }

      renderResolutionMenu();
      toggleResolutionMenu(false);
    }

    function toggleResolutionMenu(forceState) {
      const menu = document.getElementById("resolutionMenu");
      if (!menu) return;
      if (typeof forceState === "boolean") {
        menu.classList.toggle("open", forceState);
      } else {
        menu.classList.toggle("open");
      }
      if (menu.classList.contains("open")) {
        renderResolutionMenu();
      }
    }

    async function togglePiP() {
      const video = document.getElementById('video');
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled) {
          await video.requestPictureInPicture();
        } else {
          alert("আপনার ব্রাউজার পপ-আপ (Picture-in-Picture) সাপোর্ট করে না!");
        }
      } catch (error) {
        console.error("PiP Error:", error);
      }
    }

    async function cleanupAllPlayers() {
      if (shakaInstance) {
        try {
          await shakaInstance.unload();
          await shakaInstance.destroy();
        } catch (_) {}
        shakaInstance = null;
      }
      if (hlsInstance) {
        try {
          hlsInstance.destroy();
        } catch (_) {}
        hlsInstance = null;
      }
      const video = document.getElementById('video');
      if (video) {
        video.pause();
        video.removeAttribute('src');
        video.load();
      }
    }

    async function initApp(streamConfig = STREAMS[activeIndex]) {
      if (!streamConfig || !streamConfig.url) return;
      const video = document.getElementById('video');

      await cleanupAllPlayers();

      const cleanUrl = streamConfig.url.trim();
      const urlLower = cleanUrl.toLowerCase();
      const isM3u8 = urlLower.includes('.m3u8') || urlLower.indexOf('m3u8') !== -1;

      if (isM3u8) {
        if (Hls.isSupported()) {
          const hls = new Hls({
            xhrSetup: function (xhr, url) {
              xhr.withCredentials = false;
            }
          });
          hlsInstance = hls;
          hls.loadSource(cleanUrl);
          hls.attachMedia(video);

          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            selectedResolution = "auto";
            const labelEl = document.getElementById("activeResLabel");
            if (labelEl) labelEl.textContent = "(Auto)";
            video.play().catch(() => {});
          });

          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  hls.startLoad();
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  hls.recoverMediaError();
                  break;
                default:
                  showWaitNotice("স্ট্রিম লোড হতে সমস্যা হচ্ছে!");
                  break;
              }
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = cleanUrl;
          video.addEventListener('loadedmetadata', () => {
            video.play().catch(() => {});
          });
        }
      } else {
        shaka.polyfill.installAll();

        if (shaka.Player.isBrowserSupported()) {
          const player = new shaka.Player(video);
          shakaInstance = player;

          player.configure({
            abr: { enabled: true }
          });

          player.addEventListener('error', (event) => {
            console.error('Error code', event.detail.code, 'object', event.detail);
            showWaitNotice(`স্ট্রিম লোড হচ্ছে না (Error: ${event.detail.code})`);
          });

          player.addEventListener('manifestparsed', () => {
            selectedResolution = "auto";
            const labelEl = document.getElementById("activeResLabel");
            if (labelEl) labelEl.textContent = "(Auto)";
            renderResolutionMenu();
          });

          if (streamConfig.useDrm && Object.keys(streamConfig.clearKeys).length > 0) {
            player.configure({
              drm: { clearKeys: streamConfig.clearKeys }
            });
          } else {
            player.configure({
              drm: { clearKeys: {} }
            });
          }

          try {
            await player.load(cleanUrl);
            renderResolutionMenu();
            video.play().catch(() => {});
          } catch (e) {
            console.error('Error loading stream', e);
            renderResolutionMenu();
          }
        }
      }
    }

    async function playStream(index) {
      activeIndex = index;
      const streamConfig = STREAMS[activeIndex];
      if (!streamConfig) return;

      showWaitNotice();

      const titleText = `${streamConfig.sport} | ${streamConfig.matchTitle} (${streamConfig.name})`;
      document.getElementById("playerTitle").textContent = titleText;
      
      document.getElementById("ogTitle").content = titleText;
      if(streamConfig.teamA && streamConfig.teamA.logo) {
        document.getElementById("ogImage").content = streamConfig.teamA.logo;
      }

      document.getElementById("playerSection").classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });

      await initApp(streamConfig);
    }

    async function closePlayer() {
      toggleResolutionMenu(false);
      hideWaitNotice();
      if (document.pictureInPictureElement) {
        await document.exitPictureInPicture().catch(() => {});
      }
      await cleanupAllPlayers();
      document.getElementById("playerSection").classList.remove("active");
    }

    function setTab(tab) {
      currentTab = tab;
      renderMatches();
    }

    function renderMatches() {
      document.getElementById("clock").textContent = new Date().toLocaleTimeString();

      const counts = {
        all: STREAMS.length,
        live: STREAMS.filter(s => s.status === "live").length,
        recent: STREAMS.filter(s => s.status === "recent").length,
        upcoming: STREAMS.filter(s => s.status === "upcoming").length
      };

      document.getElementById("filterTabs").innerHTML = `
        <button class="tab-btn ${currentTab === 'all' ? 'active' : ''}" onclick="setTab('all')">All (${counts.all})</button>
        <button class="tab-btn ${currentTab === 'live' ? 'active' : ''}" onclick="setTab('live')">Live (${counts.live})</button>
        <button class="tab-btn ${currentTab === 'recent' ? 'active' : ''}" onclick="setTab('recent')">Recent (${counts.recent})</button>
        <button class="tab-btn ${currentTab === 'upcoming' ? 'active' : ''}" onclick="setTab('upcoming')">Upcoming (${counts.upcoming})</button>
      `;

      const list = currentTab === "all"
        ? STREAMS.map((s, idx) => ({ ...s, idx }))
        : STREAMS.map((s, idx) => ({ ...s, idx })).filter(s => s.status === currentTab);

      document.getElementById("matchList").innerHTML = list.map(item => `
        <div class="match-card" onclick="playStream(${item.idx})">
          ${item.hot ? `<div class="hot-badge">HOT 🔥</div>` : ""}
          <div class="card-top">${item.sport} | ${item.matchTitle}</div>
          <div class="card-body">
            <div class="team">
              <img src="${item.teamA.logo}" alt="${item.teamA.name}">
              <span>${item.teamA.name}</span>
            </div>
            <div class="status-box">
              ${item.status === "live"
                ? `<div class="live-text">((•))<br>Live</div>`
                : `<div class="upcoming-text">Upcoming</div>`}
            </div>
            <div class="team right">
              <span>${item.teamB.name}</span>
              <img src="${item.teamB.logo}" alt="${item.teamB.name}">
            </div>
          </div>
        </div>
      `).join("");
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const video = document.getElementById('video');
      video.addEventListener('playing', hideWaitNotice);
      video.addEventListener('waiting', () => showWaitNotice());

      renderResolutionMenu();
      updateLiveTimeCounter();
      setInterval(updateLiveTimeCounter, 1000);

      await loadStreamsFromFiles();
    });
  </script>
</body>
</html>
