<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAWON TV - Live Streaming</title>
    
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.12/shaka-player.compiled.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 330px; background-color: #1e293b; display: flex; flex-direction: column; border-right: 1px solid #334155; }
        .sidebar-header { padding: 15px; background-color: #0f172a; border-bottom: 1px solid #334155; }
        .sidebar-header h2 { font-size: 1.2rem; color: #38bdf8; margin-bottom: 10px; }
        .search-box { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background-color: #1e293b; color: #fff; outline: none; margin-bottom: 10px; }
        .cat-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
        .cat-btn { flex: 1 1 30%; padding: 6px 8px; border: 1px solid #334155; background-color: #1e293b; color: #cbd5e1; border-radius: 5px; cursor: pointer; font-size: 0.78rem; }
        .cat-btn.active { background-color: #0284c7; color: #fff; border-color: #0284c7; }
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-item { display: flex; align-items: center; padding: 10px; margin-bottom: 6px; background-color: #334155; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .channel-item:hover, .channel-item.active { background-color: #0284c7; }
        .channel-item img { width: 35px; height: 35px; object-fit: contain; margin-right: 10px; background: #0f172a; border-radius: 4px; padding: 2px; flex-shrink: 0; }
        .channel-emoji { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; margin-right: 10px; background: #0f172a; border-radius: 4px; font-size: 1rem; flex-shrink: 0; }
        .channel-meta { display: flex; flex-direction: column; min-width: 0; flex: 1; }
        .channel-name { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-tag { font-size: 0.72rem; color: #bae6fd; margin-top: 2px; }
        .main-content { flex: 1; display: flex; flex-direction: column; background-color: #0b0f19; padding: 15px; overflow-y: auto; }
        .player-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background-color: #000; border-radius: 8px; overflow: hidden; }
        #videoPlayer, #clapprPlayer { width: 100% !important; height: 100% !important; }
        .controls-panel { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: #1e293b; padding: 12px; border-radius: 8px; }
        .btn { padding: 8px 14px; background-color: #334155; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .btn:hover, .btn.active { background-color: #0284c7; }
        .btn-pip { background-color: #e11d48; }
        .status-msg { padding: 15px; text-align: center; color: #94a3b8; font-size: 0.9rem; }
        .stream-info { margin-left: auto; font-size: 0.8rem; color: #94a3b8; max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>SHAWON TV</h2>
            <input type="text" id="searchInput" class="search-box" placeholder="Search Channel..." onkeyup="filterChannels()">
            <div class="cat-tabs">
                <button class="cat-btn active" data-cat="ALL" onclick="selectCategory('ALL', this)">All</button>
                <button class="cat-btn" data-cat="Sports" onclick="selectCategory('Sports', this)">Sports</button>
                <button class="cat-btn" data-cat="Bangla" onclick="selectCategory('Bangla', this)">Bangla</button>
                <button class="cat-btn" data-cat="Hindi" onclick="selectCategory('Hindi', this)">Hindi</button>
                <button class="cat-btn" data-cat="English" onclick="selectCategory('English', this)">English</button>
            </div>
        </div>
        <div class="channel-list" id="channelList">
            <div class="status-msg">Loading channels...</div>
        </div>
    </div>

    <div class="main-content">
        <div class="player-wrapper">
            <video id="videoPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay playsinline></video>
            <div id="clapprPlayer" style="display: none;"></div>
        </div>

        <div class="controls-panel">
            <button class="btn active" id="btnVideoJs" onclick="switchEngine('videojs')">Main (HLS)</button>
            <button class="btn" id="btnClappr" onclick="switchEngine('clappr')">Clappr</button>
            <button class="btn" id="btnHtml5" onclick="switchEngine('html5')">HTML5</button>
            <button class="btn" id="btnDirect" onclick="toggleProxyMode()">Proxy: ON</button>
            <button class="btn btn-pip" onclick="togglePiP()">PIP Mode</button>
            <span class="stream-info" id="streamStatus">Ready</span>
        </div>
    </div>

    <script>
        const vercelProxy = "https://online-tv-rho.vercel.app/api/proxy?url=";

        const jsonSources = [
            { url: "dada/sport.json", category: "Sports" },
            { url: "dada/bangla.json", category: "Bangla" },
            { url: "dada/inida.json", category: "Hindi" },
            { url: "dada/englis.json", category: "English" }
        ];

        let channels = [];
        let selectedCategory = "ALL";
        let currentChannel = null;
        let useProxy = true;
        let currentEngine = "videojs";
        let hlsInstance = null;
        let clapprPlayerInstance = null;
        let shakaPlayerInstance = null;

        document.addEventListener("DOMContentLoaded", () => {
            try {
                if (window.shaka && shaka.polyfill && typeof shaka.polyfill.installAll === "function") {
                    shaka.polyfill.installAll();
                }
            } catch (e) {
                console.warn("Shaka polyfill warning:", e);
            }
            loadAllChannels();
        });

        function parseStreamAndDrm(item) {
            let rawUrl = (item.url || item.link || item.stream || item.stream_url || "").trim();
            let clearKeyMap = {};

            if (rawUrl.includes("|")) {
                const parts = rawUrl.split("|");
                rawUrl = parts[0].trim();
                const paramStr = parts.slice(1).join("&");
                const params = new URLSearchParams(paramStr.replace(/\|/g, "&"));
                const license = params.get("drmLicense") || "";
                if (license.includes(":")) {
                    const [kid, key] = license.split(":");
                    if (kid && key) clearKeyMap[kid.trim()] = key.trim();
                }
            }

            if (item.drm && typeof item.drm.license === "string" && item.drm.license.includes(":")) {
                const [kid, key] = item.drm.license.split(":");
                if (kid && key) clearKeyMap[kid.trim()] = key.trim();
            }

            const isMpd = rawUrl.toLowerCase().includes(".mpd");
            return {
                url: rawUrl,
                isMpd,
                clearKeys: Object.keys(clearKeyMap).length > 0 ? clearKeyMap : null
            };
        }

        function resolveLogo(item) {
            const candidates = [item.logoUrl, item.logo, item.image, item.icon, item.tvg_logo];
            for (const c of candidates) {
                if (typeof c === "string" && /^https?:\/\//i.test(c.trim())) {
                    return { type: "image", value: c.trim() };
                }
            }
            const fallback = (item.fallbackLogo || item.logo || "▶️").trim();
            return { type: "emoji", value: fallback || "▶️" };
        }

        function normalizeJsonItems(data, defaultCategory) {
            const rawList = Array.isArray(data)
                ? data
                : (data.channels || data.data || data.sports || data.bangla || []);

            return rawList.map(item => {
                const parsed = parseStreamAndDrm(item);
                return {
                    name: item.name || item.title || item.channel || item.tvg_name || "Unknown Channel",
                    url: parsed.url,
                    isMpd: parsed.isMpd,
                    clearKeys: parsed.clearKeys,
                    logoData: resolveLogo(item),
                    category: item.group || item.category || defaultCategory
                };
            }).filter(item => item.url);
        }

        async function loadAllChannels() {
            const channelListDiv = document.getElementById('channelList');
            const cacheBuster = Date.now();

            const results = await Promise.allSettled(
                jsonSources.map(async src => {
                    const res = await fetch(`${src.url}?v=${cacheBuster}`, { cache: "no-store" });
                    if (!res.ok) throw new Error(`${src.url} -> HTTP ${res.status}`);
                    const text = await res.text();
                    const json = JSON.parse(text);
                    return normalizeJsonItems(json, src.category);
                })
            );

            channels = [];
            const failedFiles = [];

            results.forEach((r, idx) => {
                if (r.status === "fulfilled" && Array.isArray(r.value)) {
                    channels.push(...r.value);
                } else if (r.status === "rejected") {
                    console.error("JSON Load Error:", r.reason);
                    failedFiles.push(`${jsonSources[idx].url} (${r.reason.message || r.reason})`);
                }
            });

            if (failedFiles.length > 0) {
                document.getElementById('streamStatus').textContent = `Error: ${failedFiles.join(" | ")}`;
            }

            if (channels.length > 0) {
                filterChannels();
                playChannel(channels[0]);
            } else {
                channelListDiv.innerHTML = `<div class="status-msg" style="color:#f87171;">চ্যানেল লোড করা যায়নি। JSON ফাইলগুলোর Syntax চেক করুন।</div>`;
            }
        }

        function selectCategory(cat, btnEl) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            filterChannels();
        }

        function renderChannels(list) {
            const channelListDiv = document.getElementById('channelList');
            channelListDiv.innerHTML = "";

            if (list.length === 0) {
                channelListDiv.innerHTML = `<div class="status-msg">কোনো চ্যানেল পাওয়া যায়নি।</div>`;
                return;
            }

            list.forEach((ch, index) => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                if ((currentChannel && ch.url === currentChannel.url) || (!currentChannel && index === 0)) {
                    item.classList.add('active');
                }

                item.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    playChannel(ch);
                };

                const logoHtml = ch.logoData.type === "image"
                    ? `<img src="${ch.logoData.value}" onerror="this.outerHTML='<div class=\\'channel-emoji\\'>▶️</div>'">`
                    : `<div class="channel-emoji">${ch.logoData.value}</div>`;

                const formatBadge = ch.isMpd ? "MPD (Shaka Only)" : "HLS";

                item.innerHTML = `
                    ${logoHtml}
                    <div class="channel-meta">
                        <span class="channel-name">${ch.name}</span>
                        <span class="channel-tag">${ch.category} • ${formatBadge}</span>
                    </div>
                `;
                channelListDiv.appendChild(item);
            });
        }

        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = channels.filter(ch => {
                const matchesName = ch.name.toLowerCase().includes(query);
                const matchesCat = selectedCategory === "ALL" || ch.category.toLowerCase().includes(selectedCategory.toLowerCase());
                return matchesName && matchesCat;
            });
            renderChannels(filtered);
        }

        function getFinalStreamUrl(channel) {
            const rawUrl = channel.url;
            // .mpd ফাইল কখনো প্রক্সি দিয়ে ঘোরানো হবে না, সরাসরি Shaka Player-এ যাবে
            if (channel.isMpd) return rawUrl;
            if (!useProxy) return rawUrl;
            if (rawUrl.includes("herokuapp.com/") || rawUrl.includes("workers.dev/")) {
                return rawUrl;
            }
            return vercelProxy + encodeURIComponent(rawUrl);
        }

        function playChannel(channel) {
            currentChannel = channel;
            document.getElementById('streamStatus').textContent = channel.isMpd
                ? `[Shaka MPD] Playing: ${channel.name}`
                : `[HLS] Playing: ${channel.name}`;
            loadStream(channel);
        }

        async function destroyPlayers() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            if (clapprPlayerInstance) {
                clapprPlayerInstance.destroy();
                clapprPlayerInstance = null;
            }
            if (shakaPlayerInstance) {
                await shakaPlayerInstance.destroy();
                shakaPlayerInstance = null;
            }
            const rawVideo = document.getElementById('videoPlayer');
            rawVideo.pause();
            rawVideo.removeAttribute('src');
            rawVideo.load();
        }

        // শুধুমাত্র .mpd ফাইলের জন্য Shaka Player
        async function playWithShakaOnly(channel, mpdUrl) {
            const rawVideo = document.getElementById('videoPlayer');
            const clapprContainer = document.getElementById('clapprPlayer');

            clapprContainer.style.display = 'none';
            rawVideo.style.display = 'block';

            if (!window.shaka || !shaka.Player.isBrowserSupported()) {
                document.getElementById('streamStatus').textContent = "Shaka Player not supported on this browser";
                return;
            }

            try {
                shakaPlayerInstance = new shaka.Player();
                await shakaPlayerInstance.attach(rawVideo);

                if (channel.clearKeys) {
                    shakaPlayerInstance.configure({
                        drm: { clearKeys: channel.clearKeys }
                    });
                }

                shakaPlayerInstance.addEventListener('error', (event) => {
                    const detail = event.detail;
                    console.error("Shaka Runtime Error:", detail);
                    document.getElementById('streamStatus').textContent = `Shaka Error (${detail.code || "Stream Blocked"})`;
                });

                await shakaPlayerInstance.load(mpdUrl);
                await rawVideo.play().catch(() => {});
            } catch (err) {
                console.error("Shaka MPD Load Error:", err);
                document.getElementById('streamStatus').textContent = `Shaka Failed: ${err.message || "CORS/Token Error"}`;
            }
        }

        async function loadStream(channel) {
            const rawVideo = document.getElementById('videoPlayer');
            const clapprContainer = document.getElementById('clapprPlayer');
            const finalUrl = getFinalStreamUrl(channel);

            await destroyPlayers();

            // .mpd ফাইল হলে শুধুমাত্র Shaka Player চলবে
            if (channel.isMpd) {
                await playWithShakaOnly(channel, finalUrl);
                return;
            }

            // .m3u8 / .ts ফাইল হলে Shaka Player চলবে না
            if (currentEngine === 'clappr') {
                rawVideo.style.display = 'none';
                clapprContainer.style.display = 'block';
                clapprContainer.innerHTML = "";

                clapprPlayerInstance = new Clappr.Player({
                    source: finalUrl,
                    parentId: "#clapprPlayer",
                    autoPlay: true,
                    mute: false,
                    width: '100%',
                    height: '100%',
                    mediacontrol: { seekbar: "#38bdf8", buttons: "#ffffff" }
                });
                return;
            }

            clapprContainer.style.display = 'none';
            rawVideo.style.display = 'block';

            if (currentEngine === 'html5') {
                rawVideo.src = finalUrl;
                rawVideo.play().catch(() => {});
                return;
            }

            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    enableWorker: true,
                    lowLatencyMode: false,
                    manifestLoadingTimeOut: 15000,
                    manifestLoadingMaxRetry: 3,
                    levelLoadingTimeOut: 15000,
                    levelLoadingMaxRetry: 3,
                    fragLoadingTimeOut: 20000,
                    fragLoadingMaxRetry: 4
                });

                hlsInstance.loadSource(finalUrl);
                hlsInstance.attachMedia(rawVideo);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    rawVideo.play().catch(() => {});
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                if (useProxy && finalUrl.startsWith(vercelProxy)) {
                                    document.getElementById('streamStatus').textContent = "Proxy failed, trying direct...";
                                    useProxy = false;
                                    document.getElementById('btnDirect').textContent = "Proxy: OFF";
                                    loadStream(channel);
                                } else {
                                    hlsInstance.startLoad();
                                }
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                destroyPlayers();
                                break;
                        }
                    }
                });
            } else if (rawVideo.canPlayType('application/vnd.apple.mpegurl')) {
                rawVideo.src = finalUrl;
                rawVideo.play().catch(() => {});
            }
        }

        function switchEngine(engine) {
            currentEngine = engine;
            document.querySelectorAll('.controls-panel .btn').forEach(b => {
                if (!b.classList.contains('btn-pip') && b.id !== 'btnDirect') {
                    b.classList.remove('active');
                }
            });

            if (engine === 'videojs') document.getElementById('btnVideoJs').classList.add('active');
            if (engine === 'clappr') document.getElementById('btnClappr').classList.add('active');
            if (engine === 'html5') document.getElementById('btnHtml5').classList.add('active');

            if (currentChannel) loadStream(currentChannel);
        }

        function toggleProxyMode() {
            useProxy = !useProxy;
            document.getElementById('btnDirect').textContent = useProxy ? "Proxy: ON" : "Proxy: OFF";
            if (currentChannel) loadStream(currentChannel);
        }

        async function togglePiP() {
            const video = document.getElementById('videoPlayer');
            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
            } else if (document.pictureInPictureEnabled && video) {
                await video.requestPictureInPicture();
            }
        }
    </script>
</body>
</html>
