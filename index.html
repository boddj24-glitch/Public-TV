    <style>
        :root {
            --bg-color: #161b22; 
            --accent-color: #e5b860; 
        }

        body { 
            background: #0b0e14; 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 20px; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .main-container { 
            display: flex; 
            gap: 20px; 
            max-width: 1800px; 
            margin: auto; 
            flex-wrap: wrap; 
            justify-content: center; 
        }

        .player-section { 
            flex: 3.7; 
            min-width: 320px; 
            background: var(--bg-color); 
            padding: 20px; 
            border-radius: 12px; 
        } 
        
        .header-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .logo-header { 
            font-size: 26px; 
            font-weight: 800; 
            color: var(--accent-color); 
            letter-spacing: 2px; 
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(229, 184, 96, 0.3);
            margin: 0;
            white-space: nowrap;
        }

        .header-server-switcher {
            flex-grow: 1;
            min-width: 250px;
            background: #0d1117;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            text-align: center;
        }

        .server-title {
            font-size: 12px;
            color: var(--accent-color);
            margin-bottom: 6px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .server-buttons-wrap {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .server-btn {
            background: #21262d;
            color: #fff;
            border: 1px solid #30363d;
            padding: 4px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: 0.2s;
        }

        .server-btn:hover {
            border-color: var(--accent-color);
        }

        .server-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        /* 4 টি কলাম নিশ্চিত করার জন্য minmax(130px, 1fr) করা হলো */
        .channel-list { 
            flex: 2.1; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 10px; 
            max-height: 80vh; 
            overflow-y: auto; 
            overflow-x: hidden; 
            background: var(--bg-color); 
            padding: 15px; 
            border-radius: 12px; 
            align-content: start; 
        }

        .video-box { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            position: relative; 
            margin-top: 15px;
        }
        
        #my-video, #clappr-container, #html5-video, #custom-iframe { 
            width: 100% !important; 
            height: 100% !important; 
            border: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
        }
        
        .modes { 
            display: flex; 
            gap: 10px; 
            margin-top: 15px; 
            justify-content: center; 
            flex-wrap: wrap; 
        }
        
        .btn { 
            background: #333; 
            color: #fff; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
        }
        
        .btn:hover { 
            background: var(--accent-color); 
            color: #000; 
        }
        
        .pip-btn { 
            background: #ff4757 !important; 
        }
        
        .ch-btn { 
            background: #21262d; 
            padding: 10px; 
            border-radius: 8px; 
            cursor: pointer; 
            text-align: center; 
            border: 1px solid #30363d; 
            transition: 0.3s; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 95px;
            box-sizing: border-box;
        }
        
        .ch-btn:hover { 
            background: #30363d; 
            border-color: var(--accent-color); 
        }
        
        .ch-btn img { 
            width: 50px; 
            height: 50px; 
            object-fit: contain; 
            pointer-events: none;
        }
        
        .ch-btn strong { 
            font-size: 13.2px; 
            font-weight: bold; 
            color: var(--accent-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        
        .input-box { 
            display: flex; 
            gap: 10px; 
            max-width: 1800px; 
            margin: 20px auto; 
        }
        
        #customUrlInput { 
            flex: 1; 
            padding: 15px; 
            background: var(--bg-color); 
            border: 1px solid #30363d; 
            color: white; 
            border-radius: 6px; 
        }
        
        .play-btn { 
            background: var(--accent-color); 
            border: none; 
            padding: 15px 30px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            color: #000; 
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
    </style>
</head>

        const videoEl = document.getElementById('my-video');
        const iframe = document.getElementById('custom-iframe');
        const clapprEl = document.getElementById('clappr-container');
        const html5El = document.getElementById('html5-video');
        let clapprInstance;
        let hls; 
        let currentMode = 'videojs';
        let currentUrl = '';

        function togglePIP() {
            if (videoEl.style.display !== 'none' && document.pictureInPictureEnabled) {
                videoEl.requestPictureInPicture();
            }
        }

        function switchMode(mode) {
            if (currentUrl) loadChannelUrl(currentUrl, mode);
        }

        function loadChannel(ch) {
            const buttonsContainer = document.getElementById('serverButtonsContainer');
            const channelNameEl = document.getElementById('activeChannelName');

            buttonsContainer.innerHTML = '';

            let urls = Array.isArray(ch.url) ? ch.url : [ch.url];
            channelNameEl.innerText = ch.name + " - সার্ভার পরিবর্তন করুন";

            urls.forEach((link, index) => {
                const sBtn = document.createElement('button');
                sBtn.className = 'server-btn';
                sBtn.innerText = `Server ${index + 1}`;
                if (index === 0) sBtn.classList.add('active');

                sBtn.onclick = () => {
                    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                    sBtn.classList.add('active');
                    loadChannelUrl(link, currentMode);
                };
                buttonsContainer.appendChild(sBtn);
            });

            loadChannelUrl(urls[0], currentMode);
        }

        function loadChannelUrl(url, mode) {
            currentUrl = url;
            currentMode = mode;

            videoEl.style.display = 'none';
            iframe.style.display = 'none';
            clapprEl.style.display = 'none';
            html5El.style.display = 'none';
            
            if (hls) { hls.destroy(); hls = null; }
            if (clapprInstance) { clapprInstance.destroy(); clapprInstance = null; }
            videoEl.pause();
            videoEl.src = "";
            videoEl.load();
            html5El.pause();
            html5El.src = "";
            iframe.src = "about:blank";

            if (mode === 'iframe') {
                iframe.src = url;
                iframe.style.display = 'block';
            } else if (mode === 'clappr') {
                clapprEl.style.display = 'block';
                clapprInstance = new Clappr.Player({source: url, parentId: "#clappr-container", width: '100%', height: '100%', autoPlay: true});
            } else if (mode === 'html5') {
                html5El.style.display = 'block';
                html5El.src = url;
                html5El.play();
            } else {
                videoEl.style.display = 'block';
                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(videoEl);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play());
                } else {
                    videoEl.src = url;
                    videoEl.play();
                }
            }
        }

        function playCustom() {
            const url = document.getElementById('customUrlInput').value;
            if(url) {
                document.getElementById('serverButtonsContainer').innerHTML = "";
                document.getElementById('activeChannelName').innerText = "Custom URL - সার্ভার পরিবর্তন করুন";
                loadChannelUrl(url, currentMode);
            }
        }

        const container = document.getElementById('channelContainer');
        container.innerHTML = '';

        if (channels.length > 0) {
            channels.forEach(ch => {
                const btn = document.createElement('div');
                btn.className = 'ch-btn';
                
                let img = document.createElement('img');
                img.src = ch.logo;
                img.onerror = () => { img.src = "https://i.postimg.cc/W1z5BGPZ/20240823_024712.png"; };
                
                let strong = document.createElement('strong');
                strong.innerText = ch.name;
                
                btn.appendChild(img);
                btn.appendChild(strong);
                
                btn.onclick = () => loadChannel(ch);
                container.appendChild(btn);
            });

            loadChannel(channels[0]);
        }
    </script>
